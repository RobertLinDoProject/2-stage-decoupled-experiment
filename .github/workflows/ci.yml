name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'backend[dev]'
      - name: Run backend tests
        env:
          PYTHONPATH: backend/src
        run: python -m unittest discover -s backend/src/two_stage/tests -p 'test_*.py'

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Enable pnpm with Corepack
        id: pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          echo "version=$(pnpm --version)" >> "$GITHUB_OUTPUT"
          echo "store-path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm.outputs.store-path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Typecheck frontend
        working-directory: frontend
        run: pnpm typecheck
      - name: Build frontend
        working-directory: frontend
        run: pnpm build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker services
        run: docker compose build
